name: Ready-use audit v2
on:
  push:
    paths:
      - '.github/workflows/ready-use-v2.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final UI polish
        run: |
          python3 -c "import base64;from pathlib import Path;p=Path('index.html');s=p.read_text(encoding='utf-8');css=base64.b64decode('').decode();p.write_text(s.replace('</style>',css+'</style>',1).replace('Uut: het stuur volgt alleen de slider.','Uit: het stuur volgt alleen de slider.'),encoding='utf-8')"
      - name: Audit HTML and JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          class C(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if 'id' in d:self.ids.append(d['id'])
          c=C();c.feed(s)
          dup=sorted({x for x in c.ids if c.ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
            f.write('\n'.join(scripts));name=f.name
          subprocess.run(['node','--check',name],check=True)
          for marker in ['demoWheelSlider','demoWheelRotor','ffbBtn','driveCar','requestAnimationFrame(render)','surface()']:
            if marker not in s:raise SystemExit('missing '+marker)
          print('READY USE CHECK PASSED')
          PY
      - name: Commit polished page
        run: |
          git config user.name "ClickUp Brain"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Polish final UI and animations"
          git push
