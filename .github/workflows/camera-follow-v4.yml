name: Dynamic follow camera v4
on:
  push:
    paths:
      - '.github/workflows/camera-follow-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: echo  anR0IGluIGJlZWxkLicB
 | base64 -d | python3
      - name: Commit
        run: |
          git config user.name "ClickUp Brain"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix dynamic camera and open world movement"
          git push
