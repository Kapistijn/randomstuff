name: Open-world map patch
on:
  push:
    paths:
      - '.github/workflows/open-world-map.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make the driving map open world
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
          '.drive-track{ width:100%; height:auto; display:block; border-radius:var(--radius-md); background:var(--panel-2); border:1px solid var(--line); }\n.track-bg{ fill:var(--panel-2); }\n.track-bounds{ fill:none; stroke:var(--line-strong); stroke-width:1.5; stroke-dasharray:6 6; }\n.track-cone{ fill:var(--amber); opacity:.55; }',
          '.drive-track{ width:100%; height:auto; display:block; border-radius:var(--radius-md); background:#172719; border:1px solid var(--line); }\n.track-bg{ fill:#172719; }\n.track-bounds,.track-cone{ display:none; }\n.world-road{ fill:none; stroke:#46505a; stroke-width:24; stroke-linecap:round; stroke-linejoin:round; }\n.world-road-edge{ fill:none; stroke:#6a7580; stroke-width:28; stroke-linecap:round; stroke-linejoin:round; opacity:.45; }\n.world-lane{ fill:none; stroke:#d2bd7b; stroke-width:1.4; stroke-dasharray:7 8; }\n.world-water{ fill:#173b4c; stroke:#28566a; stroke-width:1; }\n.world-tree{ fill:#2c5a36; stroke:#173a22; stroke-width:1; }\n.world-building{ fill:#38434c; stroke:#596875; stroke-width:1; }')

          old_svg = '''<rect class="track-bg" x="0" y="0" width="300" height="170" rx="18"></rect>
            <rect class="track-bounds" x="22" y="22" width="256" height="126" rx="14"></rect>
            <g class="track-cone" transform="translate(40,30)"><polygon points="0,-8 6,8 -6,8"></polygon></g>
            <g class="track-cone" transform="translate(260,30)"><polygon points="0,-8 6,8 -6,8"></polygon></g>
            <g class="track-cone" transform="translate(40,140)"><polygon points="0,-8 6,8 -6,8"></polygon></g>
            <g class="track-cone" transform="translate(260,140)"><polygon points="0,-8 6,8 -6,8"></polygon></g>'''
          new_svg = '''<rect class="track-bg" x="0" y="0" width="300" height="170" rx="18"></rect>
            <path class="world-water" d="M232 7c30 2 62 17 68 39v42c-17-7-37-9-55 0-17 8-34 3-40-10-8-17 4-33 27-38 16-4 13-25 0-33z"></path>
            <path class="world-road-edge" d="M-18 128C34 101 54 49 105 45s73 48 122 56c31 5 58-2 91-19"></path>
            <path class="world-road" d="M-18 128C34 101 54 49 105 45s73 48 122 56c31 5 58-2 91-19"></path>
            <path class="world-lane" d="M-18 128C34 101 54 49 105 45s73 48 122 56c31 5 58-2 91-19"></path>
            <path class="world-road-edge" d="M145-20c-9 34-3 59 22 79 19 16 24 43 8 67-10 16-11 34-4 62"></path>
            <path class="world-road" d="M145-20c-9 34-3 59 22 79 19 16 24 43 8 67-10 16-11 34-4 62"></path>
            <path class="world-lane" d="M145-20c-9 34-3 59 22 79 19 16 24 43 8 67-10 16-11 34-4 62"></path>
            <g aria-hidden="true">
              <circle class="world-tree" cx="26" cy="30" r="8"></circle><circle class="world-tree" cx="46" cy="23" r="6"></circle>
              <circle class="world-tree" cx="70" cy="145" r="8"></circle><circle class="world-tree" cx="91" cy="137" r="6"></circle>
              <circle class="world-tree" cx="265" cy="133" r="9"></circle><circle class="world-tree" cx="286" cy="145" r="7"></circle>
              <rect class="world-building" x="18" y="65" width="24" height="19" rx="3"></rect>
              <rect class="world-building" x="246" y="18" width="30" height="20" rx="3"></rect>
            </g>'''
          if old_svg not in s:
              raise SystemExit('Map markup not found, no changes made')
          s = s.replace(old_svg, new_svg)

          s = s.replace(
          'Het autootje hierboven wordt bestuurd met precies dezelfde stuur-, gas- en remstatus als hierboven — probeer het in allebei de standen.',
          'Open wereld zonder hekken: rijd over wegen, gras en langs het water. Bij de rand gaat de wereld naadloos aan de andere kant verder.')

          old_move = '''autoX = Math.max(AUTO_RAND, Math.min(TRACK_W - AUTO_RAND, autoX + Math.sin(rad) * autoSnelheid * dt));
      autoY = Math.max(AUTO_RAND, Math.min(TRACK_H - AUTO_RAND, autoY - Math.cos(rad) * autoSnelheid * dt));'''
          new_move = '''autoX += Math.sin(rad) * autoSnelheid * dt;
      autoY -= Math.cos(rad) * autoSnelheid * dt;

      // Open wereld: geen hekken of botsende randen. De kaart loopt naadloos door.
      if (autoX < -AUTO_RAND) { autoX = TRACK_W + AUTO_RAND; }
      if (autoX > TRACK_W + AUTO_RAND) { autoX = -AUTO_RAND; }
      if (autoY < -AUTO_RAND) { autoY = TRACK_H + AUTO_RAND; }
      if (autoY > TRACK_H + AUTO_RAND) { autoY = -AUTO_RAND; }'''
          if old_move not in s:
              raise SystemExit('Driving bounds code not found, no changes made')
          s = s.replace(old_move, new_move)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched map
        run: |
          git config user.name "ClickUp Brain"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make driving demo an open world without fences"
          git push
