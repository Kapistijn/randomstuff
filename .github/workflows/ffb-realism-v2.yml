name: Realistic Force Feedback v2
on:
  push:
    paths:
      - '.github/workflows/ffb-realism-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject verified FFB layer
        run: |
          python3 -c "import base64;from pathlib import Path;p=Path('index.html');s=p.read_text(encoding='utf-8');x=base64.b64decode('').decode();p.write_text(s.replace('</body>',x+'</body>',1),encoding='utf-8')"
      - name: Validate and commit
        run: |
          python3 -c "from pathlib import Path;s=Path('index.html').read_text(encoding='utf-8');assert 'surface' in s and 'requestAnimationFrame(render)' in s and 'aria-pressed' in s;print('FFB smoke test passed')"
          git config user.name "ClickUp Brain"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make Force Feedback surface-aware and self-centering"
          git push
