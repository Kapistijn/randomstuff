name: Dynamic follow camera v5
on:
  push:
    paths:
      - '.github/workflows/camera-follow-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject follow camera
        run: |
          echo  | base64 -d > /tmp/camera.html
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); x=Path('/tmp/camera.html').read_text(encoding='utf-8'); p.write_text(s.replace('</body>',x+'</body>',1),encoding='utf-8')"
      - name: Validate
        run: python3 -c "from pathlib import Path; s=Path('index.html').read_text(encoding='utf-8'); assert 'requestAnimationFrame(follow)' in s; assert 'viewBox' in s; print('camera smoke test passed')"
      - name: Commit
        run: |
          git config user.name "ClickUp Brain"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add reliable dynamic follow camera"
          git push
