name: Realistic Force Feedback
on:
  push:
    paths:
      - '.github/workflows/ffb-realism.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add realistic feedback layer
        run: |
          echo  | base64 -d > /tmp/ffb.html
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); x=Path('/tmp/ffb.html').read_text(encoding='utf-8'); p.write_text(s.replace('</body>',x+'</body>',1),encoding='utf-8')"
      - name: Smoke test
        run: python3 -c "from pathlib import Path; s=Path('index.html').read_text(encoding='utf-8'); assert 'surface' in s and 'requestAnimationFrame(render)' in s and 'aria-pressed' in s; print('FFB smoke test passed')"
      - name: Commit
        run: |
          git config user.name "ClickUp Brain"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make Force Feedback surface-aware and self-centering"
          git push
