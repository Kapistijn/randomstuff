name: Copy polish
on:
  push:
    paths:
      - '.github/workflows/copy-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix status text
        run: python3 -c "from pathlib import Path;p=Path('index.html');s=p.read_text(encoding='utf-8');p.write_text(s.replace('Uut: het stuur volgt alleen de slider.','Uit: het stuur volgt alleen de slider.'),encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name "ClickUp Brain"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Polish Force Feedback status copy"
          git push
